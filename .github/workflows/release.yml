name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Install installer tooling
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          dotnet tool install --global wix --version 5.0.0

      # The installers ship the installed build (settings in %APPDATA%), built above.
      - name: Installers
        shell: pwsh
        run: |
          ./installer/build.ps1 -Format msi -SkipBuild -Tag "${{ github.ref_name }}"
          ./installer/build.ps1 -Format nsis -SkipBuild -Tag "${{ github.ref_name }}"

      # Then the portable build (settings next to the exe) replaces it in target/release:
      # only the root crate is rebuilt.
      - name: Build portable
        run: cargo build --release --locked --features portable

      - name: Package portable
        shell: pwsh
        run: |
          $name = "filemanager-${{ github.ref_name }}-windows-x64-portable"
          Copy-Item target/release/filemanager.exe dist/filemanager-portable.exe
          $zip = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/zip"
          Copy-Item target/release/filemanager.exe, README.md $zip
          Compress-Archive -Path "$zip/*" -DestinationPath "dist/$name.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/filemanager-portable.exe
            dist/*.zip
            dist/*.msi
            dist/*-setup.exe
