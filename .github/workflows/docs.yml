name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "web-docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-docs
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate
        run: bun run generate
        env:
          NUXT_APP_BASE_URL: /GPUIFileManager/
          NUXT_SITE_URL: https://xpol555.github.io/GPUIFileManager

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
