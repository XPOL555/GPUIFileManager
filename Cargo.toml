[package]
name = "filemanager"
version = "0.1.0"
edition = "2024"
description = "A lightweight, fast file manager for Windows with bounded memory use"
license = "MIT"
repository ="https://github.com/XPOL555/GPUIFileNamanger"
publish = false

[dependencies]
gpui-kit = "0.7.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
raw-window-handle = "0.6"
# Same versions gpui-kit uses (RenderImage frames, async channels); not GPUI itself.
image = { version = "0.25", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
